<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 100" width="380" height="100" role="img" aria-label="НЕЙРОДОКС — Документы. Знания. Решения.">
  <defs>
    <linearGradient id="lgBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B7FE8"/>
      <stop offset="100%" stop-color="#1A52C8"/>
    </linearGradient>
    <linearGradient id="lgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C2D4A"/>
      <stop offset="100%" stop-color="#0D1B2E"/>
    </linearGradient>
    <linearGradient id="lgFold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7EB3FF"/>
      <stop offset="100%" stop-color="#4A8AE8"/>
    </linearGradient>
  </defs>

  <!-- Mark (scaled to 90px height, centered vertically) -->
  <g transform="translate(5,5) scale(0.9)">
    <!-- Left vertical bar -->
    <rect x="10" y="10" width="16" height="80" rx="3" fill="url(#lgDark)"/>
    <!-- Diagonal -->
    <polygon points="24,10 40,10 62,46 62,62" fill="url(#lgDark)"/>
    <!-- Right document body -->
    <path d="M52 90 L52 28 L76 28 L76 10 L88 10 L88 87 Q88 90 85 90 Z" fill="url(#lgBlue)"/>
    <!-- Fold -->
    <path d="M76 10 L76 28 L88 28 Z" fill="url(#lgFold)"/>
    <!-- Lines -->
    <line x1="60" y1="42" x2="80" y2="42" stroke="white" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>
    <line x1="60" y1="54" x2="80" y2="54" stroke="white" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>
    <line x1="60" y1="66" x2="80" y2="66" stroke="white" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>
    <line x1="60" y1="78" x2="72" y2="78" stroke="white" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>
  </g>

  <!-- Wordmark -->
  <text x="108" y="54" font-family="'Plus Jakarta Sans','Manrope','Arial',sans-serif" font-size="32" font-weight="700" letter-spacing="2" fill="#0B1E3D">НЕЙРОДОКС</text>
  <text x="109" y="74" font-family="'Plus Jakarta Sans','Manrope','Arial',sans-serif" font-size="12" font-weight="500" letter-spacing="0.5" fill="#2B5CC8">Документы. Знания. Решения.</text>
</svg>
