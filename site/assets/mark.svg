<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="dG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E2D45"/>
      <stop offset="100%" stop-color="#0C1828"/>
    </linearGradient>
    <linearGradient id="bG" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#4A80E8"/>
      <stop offset="100%" stop-color="#2A5CC8"/>
    </linearGradient>
    <linearGradient id="fG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8AB8F8"/>
      <stop offset="100%" stop-color="#5A90E0"/>
    </linearGradient>
  </defs>

  <!-- Left vertical bar of N -->
  <rect x="8" y="8" width="17" height="84" rx="4" fill="url(#dG)"/>

  <!-- Diagonal of N -->
  <polygon points="25,8 40,8 47,92 32,92" fill="url(#dG)"/>

  <!-- Document body: right side, with folded top-left corner -->
