<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="НЕЙРОДОКС">
  <defs>
    <linearGradient id="gBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B7FE8"/>
      <stop offset="100%" stop-color="#1A52C8"/>
    </linearGradient>
    <linearGradient id="gDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C2D4A"/>
      <stop offset="100%" stop-color="#0D1B2E"/>
    </linearGradient>
    <linearGradient id="gFold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7EB3FF"/>
      <stop offset="100%" stop-color="#4A8AE8"/>
    </linearGradient>
  </defs>

  <!-- Dark left N stroke + diagonal -->
  <path d="M10 90 L10 10 L24 10 L58 62 L58 10 L0 10" fill="none"/>
  <!-- Left vertical bar (dark) -->
  <rect x="10" y="10" width="16" height="80" rx="3" fill="url(#gDark)"/>
  <!-- Diagonal bar (dark) -->
  <polygon points="24,10 40,10 62,46 62,62" fill="url(#gDark)"/>

  <!-- Right document shape (blue) with folded corner -->
  <!-- Main body -->
  <path d="M52 90 L52 28 L76 28 L76 10 L88 10 L88 87 Q88 90 85 90 Z" fill="url(#gBlue)"/>
  <!-- Folded corner triangle -->
  <path d="M76 10 L76 28 L88 28 Z" fill="url(#gFold)"/>
  <!-- Document lines -->
  <line x1="60" y1="42" x2="80" y2="42" stroke="white" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>
  <line x1="60" y1="54" x2="80" y2="54" stroke="white" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>
  <line x1="60" y1="66" x2="80" y2="66" stroke="white" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>
  <line x1="60" y1="78" x2="72" y2="78" stroke="white" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>
</svg>
