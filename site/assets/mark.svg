  <!-- White text lines on document -->
  <line x1="57" y1="52" x2="80" y2="52" stroke="white" stroke-width="3.8" stroke-linecap="round" opacity="0.92"/>
  <line x1="57" y1="63" x2="80" y2="63" stroke="white" stroke-width="3.8" stroke-linecap="round" opacity="0.92"/>
  <line x1="57" y1="74" x2="80" y2="74" stroke="white" stroke-width="3.8" stroke-linecap="round" opacity="0.92"/>
  <line x1="57" y1="83" x2="70" y2="83" stroke="white" stroke-width="3.8" stroke-linecap="round" opacity="0.92"/>
</svg>
