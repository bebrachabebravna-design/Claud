<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="НЕЙРОДОКС">
  <defs>
    <linearGradient id="gB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4080F0"/>
      <stop offset="100%" stop-color="#1A4EC8"/>
    </linearGradient>
    <linearGradient id="gD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1C2E4A"/>
      <stop offset="100%" stop-color="#0C1A30"/>
    </linearGradient>
    <linearGradient id="gF" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#90C0FF"/>
      <stop offset="100%" stop-color="#5090E8"/>
    </linearGradient>
  </defs>

  <!-- Left vertical bar of N (dark) -->
  <rect x="8" y="8" width="18" height="80" rx="3" fill="url(#gD)"/>

  <!-- Diagonal stroke of N (dark) — from top-right of left bar to bottom-left of doc -->
  <polygon points="26,8 44,8 50,88 32,88" fill="url(#gD)"/>

  <!-- Right side: document body (blue) -->
  <!-- Main rect minus folded corner -->
  <path d="M48 88 L48 30 L68 30 L68 8 L84 8 Q88 8 88 12 L88 84 Q88 88 84 88 Z" fill="url(#gB)"/>

  <!-- Folded corner (lighter blue) -->
  <path d="M68 8 L68 30 L88 30 Z" fill="url(#gF)"/>

  <!-- Text lines on document -->
  <line x1="56" y1="42" x2="78" y2="42" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <line x1="56" y1="53" x2="78" y2="53" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <line x1="56" y1="64" x2="78" y2="64" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <line x1="56" y1="75" x2="70" y2="75" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
</svg>
